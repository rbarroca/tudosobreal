    <!--app-head-->
    <!-- GA4 diferido com requestIdleCallback — não bloqueia render nem hydration -->
    <script>
      function loadGA4() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-2RW1507NGF';
        s.async = true;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-2RW1507NGF', { 'send_page_view': false });
        gtag('event', 'page_view');
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGA4, { timeout: 4000 });
      } else {
        setTimeout(loadGA4, 3500);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
