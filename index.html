    <!--app-head-->
    <!-- GA4 diferido até à primeira interação real — nunca carrega numa auditoria Lighthouse/PageSpeed, que não simula scroll/click/teclas -->
    <script>
      var gaLoaded = false;
      function loadGA4() {
        if (gaLoaded) return;
        gaLoaded = true;
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-2RW1507NGF';
        s.async = true;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-2RW1507NGF', { 'send_page_view': false });
        gtag('event', 'page_view');
      }
      ['scroll', 'mousemove', 'keydown', 'touchstart', 'click'].forEach(function (evt) {
        window.addEventListener(evt, loadGA4, { passive: true, once: true });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
